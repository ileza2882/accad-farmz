<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCAD FARMS | Precision Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mint: {
                50: '#f0fdf9',
                400: '#00df9a',
                500: '#00c185',
                600: '#059669',
              },
              forest: {
                900: '#001a12',
                950: '#000f0b',
              },
              slate: {
                950: '#020617',
              }
            },
            boxShadow: {
              'vibrant': '0 25px 60px -15px rgba(0, 0, 0, 0.08), 0 10px 20px -5px rgba(0, 223, 154, 0.04)',
              'vibrant-hover': '0 60px 100px -20px rgba(0, 0, 0, 0.15), 0 30px 60px -10px rgba(0, 223, 154, 0.25)',
            },
            animation: {
              'glow-slow': 'glowMove 15s ease-in-out infinite alternate',
              'glow-slower': 'glowMove 25s ease-in-out infinite alternate-reverse',
            }
          }
        }
      }
    </script>
    <style>
        @keyframes glowMove {
          0% { transform: translate(0, 0) scale(1); }
          50% { transform: translate(5%, 10%) scale(1.1); }
          100% { transform: translate(-5%, 5%) scale(0.95); }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        html {
            overflow-x: hidden;
        }

        #root {
            overflow-x: hidden;
            max-width: 100vw;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .dark-tech-grid {
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(0, 223, 154, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 223, 154, 0.03) 1px, transparent 1px);
        }

        .appealing-card {
            background: #ffffff;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            border: 1px solid #e2e8f0;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .appealing-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.6s;
            pointer-events: none;
            z-index: 50;
        }

        .appealing-card:hover::after {
            left: 100%;
        }

        .appealing-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        @keyframes subtle-float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }

        .float-animation {
            animation: subtle-float 7s ease-in-out infinite;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #ffffff; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00df9a; }
    </style>
</head>
<body class="bg-white">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
